# IAM / Casdoor → 10.20.201.215:8000
# 飞书重定向 = https://open.vnet.com/idp/callback
#
# 不要占用根路径 /api/、/assets/（会抢走 Apifox 文档站）。
# 飞书链路用的接口改写到 /idp/api/，静态资源走 /idp/assets/。

# 只反代 Casdoor。飞书 app_id / state 由 ProviderHintRedirect.js 拼。
location = /idp/login/oauth/authorize {
    if ($arg_provider_hint = "") {
        return 302 /idp/login/oauth/authorize?$args&provider_hint=provider_feishu;
    }
    proxy_pass http://10.20.201.215:8000/login/oauth/authorize$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /idp;
    proxy_set_header Accept-Encoding "";
}

location /idp/ {
    proxy_pass http://10.20.201.215:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /idp;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Accept-Encoding "";
    proxy_redirect http://10.20.201.215:8000/ /idp/;
    proxy_redirect http://10.20.201.215:8000 /idp;
    sub_filter 'src="/assets/' 'src="/idp/assets/';
    sub_filter 'href="/assets/' 'href="/idp/assets/';
    sub_filter_once off;
}

# 飞书回调页写死根路径 /AuthCallbackHandler.js
location = /AuthCallbackHandler.js {
    proxy_pass http://10.20.201.215:8000/AuthCallbackHandler.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    sub_filter 'var redirectUri = window.location.origin + "/callback";' 'var redirectUri = window.location.origin + "/idp/callback";';
    sub_filter 'if (window.location.origin === realRedirectUrl)' 'if (window.location.origin === realRedirectUrl && new URL(realRedirectUri).pathname.indexOf("/app-") !== 0)';
    sub_filter 'window.location.origin + "/api/login' 'window.location.origin + "/idp/api/login';
    sub_filter_once off;
    sub_filter_types application/javascript application/x-javascript text/javascript text/plain;
}

# hint 页写死 /ProviderHintRedirect.js 和 /api/get-*
location = /ProviderHintRedirect.js {
    proxy_pass http://10.20.201.215:8000/ProviderHintRedirect.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
    sub_filter '"/api/' '"/idp/api/';
    sub_filter_once off;
    sub_filter_types application/javascript application/x-javascript text/javascript text/plain;
}

# SPA 路由可能把地址栏收成根路径 /login /callback /signup
location ^~ /login {
    proxy_pass http://10.20.201.215:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Accept-Encoding "";
}

location ^~ /callback {
    proxy_pass http://10.20.201.215:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /signup {
    proxy_pass http://10.20.201.215:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
